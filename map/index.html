<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montréal Sports Facilities</title>

  <!-- Leaflet (map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #controls { padding: 10px; display: flex; gap: 10px; align-items: center; }
    #map { height: calc(100vh - 50px); }
  </style>
</head>
<body>
  <div id="controls">
    <label>Sport:
      <select id="sportFilter"><option value="all">All</option></select>
    </label>
    <button id="nearMe">Near me</button>
    <span id="count"></span>
  </div>
  <div id="map"></div>

  <script>
    const DATA_FILE = "terrain_sport_ext.json";

    // The TYPE column is too broad ("Sportif", "Récréatif"), so we find the sport
    // by looking for keywords in NOM instead. Add/remove sports here.
    const SPORTS = {
      "Basketball": ["basket"],
      "Soccer": ["soccer"],
      "Tennis": ["tennis"],
      "Pickleball": ["pickleball"],
      "Volleyball": ["volley"],
      "Baseball": ["baseball", "balle"],
      "Football": ["football"],
      "Skatepark": ["planche", "skate"],
      "Skating rink": ["patinoire"],
      "Pool": ["piscine"],
      "Outdoor gym": ["entraînement", "exercice"],
      "Pétanque": ["pétanque"]
    };

    function getSport(nom) {
      const n = (nom || "").toLowerCase();
      for (const [sport, keywords] of Object.entries(SPORTS)) {
        if (keywords.some(k => n.includes(k))) return sport;
      }
      return null; // not a sport we care about (playgrounds, benches, etc.)
    }

    // ---- Map, centred on Montréal ----
    const map = L.map("map").setView([45.5019, -73.5674], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors | Data: Ville de Montréal (CC-BY 4.0)"
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    let facilities = [];

    // ---- Load the GeoJSON ----
    fetch(DATA_FILE)
      .then(res => res.json())
      .then(geojson => {
        console.log("Example feature:", geojson.features[0]); // check property names here

        // L.geoJSON reads the geometry for us (point, line or polygon).
        // We turn every shape into a single point (its centre) so we can use markers.
        L.geoJSON(geojson, {
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            const sport = getSport(p.NOM);
            if (!sport) return;

            const center = layer.getLatLng ? layer.getLatLng() : layer.getBounds().getCenter();
            facilities.push({
              name: p.NOM,
              borough: p.ARROND,
              sport: sport,
              lat: center.lat,
              lng: center.lng
            });
          }
        });

        fillSportDropdown();
        drawMarkers("all");
      })
      .catch(err => console.error("Couldn't load data:", err));

    function fillSportDropdown() {
      const select = document.getElementById("sportFilter");
      [...new Set(facilities.map(f => f.sport))].sort().forEach(s => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });
    }

    function drawMarkers(sport) {
      markersLayer.clearLayers();
      const shown = facilities.filter(f => sport === "all" || f.sport === sport);
      shown.forEach(f => {
        L.marker([f.lat, f.lng])
          .bindPopup(`<b>${f.name}</b><br>${f.borough || ""}`)
          .addTo(markersLayer);
      });
      document.getElementById("count").textContent = `${shown.length} facilities`;
    }

    document.getElementById("sportFilter").addEventListener("change", e => {
      drawMarkers(e.target.value);
    });

    // ---- "Near me" ----
    document.getElementById("nearMe").addEventListener("click", () => {
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        map.setView([latitude, longitude], 15);
        L.circleMarker([latitude, longitude], { radius: 8, color: "blue" })
          .addTo(map)
          .bindPopup("You are here")
          .openPopup();
      }, () => alert("Couldn't get your location"));
    });
  </script>
</body>
</html>
